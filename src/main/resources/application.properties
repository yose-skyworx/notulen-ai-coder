spring.application.name=notulen-ai

server.port=9160

## Virtual threads (Java 25): request handling + Spring's application task executor
spring.threads.virtual.enabled=true

## OSIV disabled (house style): lazy associations must be resolved inside the service transaction.
spring.jpa.open-in-view=false

## Multipart (avatar / signature uploads)
spring.servlet.multipart.max-file-size=40MB
spring.servlet.multipart.max-request-size=40MB

## PostgreSQL (pgvector-enabled instance). Credentials come from the environment
## so no secret is committed: set DB_USERNAME and DB_PASSWORD (e.g. in a local .env
## or run config) before starting the app.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/ragdb}
spring.datasource.username=${DB_USERNAME:dev2}
spring.datasource.password=${DB_PASSWORD:***REDACTED-DB-PASSWORD***}
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

## JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
## Batch inserts/updates: the document pipeline writes ~1500 elements + chunks per document to a
## REMOTE Postgres, so one round-trip per row dominated persist time. Batching groups them into
## multi-row JDBC batches. (order_inserts groups same-type inserts so chunk+link inserts batch too.)
## NOTE: the entities use SEQUENCE ids with allocationSize=1, so Hibernate still does one nextval
## round-trip per row; raising allocationSize (and ALTER SEQUENCE ... INCREMENT) removes those too.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true
# drop n create table again, good for testing, comment this in production
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

## Spring AI pgvector vector store (pgvector extension is enabled on this database).
## Note: the knowledge-base feature stores embeddings in its own document_chunks.embedding
## column (hibernate-vector), not Spring AI's managed vector_store table.
spring.ai.vectorstore.pgvector.initialize-schema=true

## Spring AI models: activate only the OpenAI-compatible EMBEDDING model via the sky-inference
## endpoint. The deployed embedding model is qwen3-embedding-0.6b (1024-dim); the endpoint does not
## serve bge-m3. Chat/LLM orchestration stays on Embabel, so the OpenAI chat auto-config is switched
## off to avoid competing ChatModel beans.
spring.ai.model.chat=none
spring.ai.model.embedding=openai
# Base URL MUST include /v1: the OpenAI SDK appends '/embeddings', so without /v1 the app posts to
# '/embeddings' and the server returns 500. Correct path is '/v1/embeddings'.
spring.ai.openai.base-url=${EMBEDDING_BASE_URL:https://inference.example.internal/v1}
# The endpoint ignores the key, but the OpenAI client requires a non-blank value.
spring.ai.openai.api-key=${EMBEDDING_API_KEY:sky-inference}
spring.ai.openai.embedding.options.model=${EMBEDDING_MODEL:qwen3-embedding-0.6b}
# The embedding server is slow (observed 100-150s per batch of 8). Spring AI's defaults are a 60s
# per-request timeout and 3 SDK retries, so every call times out at 60s and is retried 4x, each retry
# orphaning a server-side computation (-> Broken pipe server-side). Raise the timeout above the
# server's worst-case latency and disable SDK-level retries; EmbeddingService does its own bounded
# retry-with-backoff for genuine transient 503s. NOTE: this is a mitigation - the real fix is the
# server-side embedding latency.
spring.ai.openai.embedding.timeout=${EMBEDDING_TIMEOUT:300s}
spring.ai.openai.embedding.max-retries=${EMBEDDING_MAX_RETRIES:0}

## MinIO object storage (original uploaded documents). Credentials come from the environment
## so no secret is committed: set MINIO_ACCESS_KEY and MINIO_SECRET_KEY before starting the app.
## Disabled for now: originals are written to the local filesystem (minio.local-dir) instead.
## Set MINIO_ENABLED=true (or minio.enabled=true) to use MinIO.
minio.enabled=${MINIO_ENABLED:false}
minio.local-dir=${MINIO_LOCAL_DIR:storage/documents}
minio.endpoint=${MINIO_ENDPOINT:http://localhost:7501}
minio.access-key=${MINIO_ACCESS_KEY:slik-app}
minio.secret-key=${MINIO_SECRET_KEY:***REDACTED-MINIO-SECRET***}
minio.bucket=${MINIO_BUCKET:noncbas}

## Document conversion service (AnyDoc + PaddleOCR), used for document extraction.
tika.server.url=${TIKA_SERVER_URL:https://tika.example.internal}
## Bearer token for POST /v1/convert. The default on the next line IS committed, so this value lives in
## git history; override it per environment with TIKA_SERVER_TOKEN (IntelliJ: Run > Edit Configurations).
tika.server.token=${TIKA_SERVER_TOKEN:***REDACTED-TIKA-TOKEN***}

## DEV ONLY: trust any TLS cert for outbound RestClient calls (Tika + embeddings), because the
## internal *.example.internal services use a CA the JVM does not trust. Set false in production and
## import the CA/cert into a truststore instead.
app.tls.insecure=${INSECURE_TLS:true}

## Knowledge-base document processing / chunking defaults (tunable, not hardcoded).
knowledge.chunk.target-tokens=700
knowledge.chunk.overlap-tokens=100
knowledge.chunk.min-tokens=150
knowledge.chunk.max-tokens=1000
knowledge.embedding.dimension=1024
knowledge.embedding.batch-size=16
knowledge.embedding.max-input-chars=8000
knowledge.embedding.max-retries=4
knowledge.embedding.retry-delay-ms=3000
knowledge.processing.max-attempts=3
knowledge.upload.max-file-size-bytes=41943040
# Number of chunks retrieved for grounding (default 5). Raised because PassageRerankerService searches all
# of them for the lines that answer the question, and the right chunk is not always rank 1.
knowledge.rag.top-k=10
# Passages handed to the LLM, one per distinct chunk. Kept at 1: lfm-1.2b answers correctly from a single
# short passage but answers from the wrong one as soon as a second is present. Raise only with a bigger model.
knowledge.rag.max-passages=1
# Budget per passage, and lines kept around a matched line (a parameter's name, its allowed values and its
# explanation are consecutive rows in these documents). A matched line that is a whole sentence keeps only
# the fragments around it and stops at the next prose sentence: a section intro keeps the numbered procedure
# listed under it, but not the unrelated paragraph that follows.
knowledge.rag.passage-budget-chars=600
knowledge.rag.passage-window-lines=3
# Minimum lexical score for a line to become a passage. When nothing reaches it the answer is reported as
# "not in the documents" WITHOUT an LLM call: given a context that lacks the answer, the model invents one.
knowledge.rag.min-passage-score=1.0
# Greedy decoding; measured accuracy drops as soon as sampling is enabled.
knowledge.rag.temperature=0.0
# Diagnostic: log the prompt sent to the LLM and the generated answer. Verbose, no extra LLM call.
# For the raw wire JSON also set logging.level.com.embabel=DEBUG.
knowledge.rag.debug-log=true

## Embabel model provider — OpenAI-compatible chat endpoint. Point LLM_BASE_URL / LLM_MODEL at the
## GPU inference server. The RAG answer action asks for plain text, not structured output: grounding and
## citations are derived server-side, because a small model cannot fill a JSON schema reliably.
# Supply the real gateway key via the OPENAI_CUSTOM_API_KEY env var; the default is a non-secret
# placeholder (the OpenAI client only requires a non-blank value). Never commit a live key here.
embabel.agent.platform.models.openai.custom.base-url=${LLM_BASE_URL:https://inference.example.internal/v1}
embabel.agent.platform.models.openai.custom.api-key=${OPENAI_CUSTOM_API_KEY:sky-inference}
embabel.agent.platform.models.openai.custom.models=${LLM_MODEL:lfm-1.2b}
embabel.models.default-llm=${LLM_MODEL:lfm-1.2b}

## Automated code review (GitHub -> role -> guideline from this database -> LLM). DISABLED by default:
## adding the module changes nothing about a running application until code-review.enabled is set, and AI
## review stays separately off until inference.enabled is set. The review standard is NOT read from the
## repository under review - it lives in code_review_guidelines here, one active version per review role.
## See code-review-plan.md for the rationale.
code-review.enabled=${CODE_REVIEW_ENABLED:true}
code-review.timezone=Asia/Jakarta
code-review.schedule.cron=0 5 0 * * *
# Concurrency is pinned at 1: the inference server is CPU-bound and must not receive parallel requests.
# Do not raise either value before inference throughput has actually been measured.
code-review.execution.global-concurrency=1
code-review.execution.file-concurrency=1
code-review.execution.retry-attempts=3
code-review.execution.retry-initial-delay-ms=3000
# Context budgets are placeholders for a more capable future chat model, NOT tuned to lfm-1.2b, which
# produces unusable output well below these sizes (see the measurements on ProjectKnowledgeRagAgent).
code-review.context.max-input-tokens=5000
code-review.context.max-output-tokens=1500
code-review.context.max-guideline-tokens=1200
code-review.context.max-diff-tokens=1500
code-review.context.max-source-context-tokens=1200
# Off: with no capable chat model deployed, files are recorded SKIPPED/INFERENCE_DISABLED and runs end
# COMPLETED_WITH_WARNING, while every deterministic step still executes.
code-review.inference.enabled=${CODE_REVIEW_INFERENCE_ENABLED:false}
code-review.inference.timeout-seconds=300
# Deployment-wide GitHub personal access token. ONE PAT serves every registered repository, so it needs
# read access to all of them. NO committed default: this file is tracked by git, so any value written
# here becomes a leaked secret in history. Set GITHUB_TOKEN in the environment instead. The token is
# never stored in the database, never logged, and never returned by an endpoint.
code-review.github.token=${GITHUB_TOKEN:}
# The only host this module calls. githubRestClient is built from a fresh RestClient.builder() so it does
# NOT inherit the app.tls.insecure trust-all customizer - a PAT must never travel unverified.
code-review.github.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
code-review.github.api-version=2022-11-28
code-review.github.connect-timeout=15s
code-review.github.read-timeout=60s
code-review.github.page-size=100
code-review.github.max-pages=20
code-review.github.max-file-bytes=1048576
code-review.exclusions.patterns=**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/out/**,**/.git/**,**/*.min.js,**/*.min.css,**/*.map,**/package-lock.json,**/yarn.lock,**/pnpm-lock.yaml,**/*.lock,**/*.class,**/*.jar,**/*.war,**/*.png,**/*.jpg,**/*.jpeg,**/*.gif,**/*.ico,**/*.pdf,**/*.zip,**/*.tar,**/*.gz

## Which files play which review role. The role is what selects the standard: it picks the active
## code_review_guidelines row the file is reviewed against. A file that plays no role has no standard, so
## it is recorded SKIPPED with reason NOT_A_TARGET_ROLE and never reviewed; a role whose library entry has
## no active version is SKIPPED as NO_GUIDELINE instead. Files of every other language are unaffected.
##
## Each role has three pattern tiers, and the TIER beats the role: every role's filename list is consulted
## before any role's directory list, so entity/OrderService.java resolves to SERVICE and not ENTITY.
## Within one tier the ReviewRoleType declaration order (SERVICE, CONTROLLER, ENTITY) breaks ties. The
## third tier scans annotations in content the pipeline has already fetched, and only applies to .java.
##
## Setting a list here REPLACES the coded default wholesale, it does not add to it. Leaving all three of a
## role's lists empty means that role can never resolve. The directory tiers match paths rather than Java
## files, so they also reach test sources and non-Java files under a role directory - add **/src/test/** to
## exclusions.patterns above if tests should never be reviewed.
##
## A commit-based review uses all three tiers, the annotation tier settling a Java file whose path matched
## nothing. A whole-branch review (trigger-branch below) uses only the two pattern tiers, because
## consulting the annotations there would mean fetching every Java file in the branch that missed both
## patterns - exactly the cost branch-review.max-files exists to prevent.
code-review.java-filter.service.filename-patterns=**/*Service.java,**/*ServiceImpl.java
code-review.java-filter.service.path-patterns=**/service/**,**/services/**
code-review.java-filter.service.annotations=@Service
code-review.java-filter.controller.filename-patterns=**/*Controller.java,**/*RestController.java
code-review.java-filter.controller.path-patterns=**/controller/**,**/controllers/**
code-review.java-filter.controller.annotations=@RestController,@Controller
code-review.java-filter.entity.filename-patterns=**/*Entity.java
code-review.java-filter.entity.path-patterns=**/entity/**,**/entities/**
code-review.java-filter.entity.annotations=@Entity

## Whole-branch review (POST /api/code-review/run/trigger-branch), which lists every file the branch holds
## rather than one commit's diff, and examines the ones java-filter above resolves to a role that has an
## active guideline. max-files bounds how many are examined: each costs one GitHub content fetch and, when
## inference is on, one model call at a file concurrency of one. It is applied after the exclusion, role
## and guideline checks, so the budget is spent on files that will actually be reviewed. Files past the
## ceiling are recorded as SKIPPED with reason BRANCH_FILE_LIMIT, never dropped, so the response still
## accounts for every file in the branch. Zero or negative disables the ceiling.
code-review.branch-review.max-files=${CODE_REVIEW_BRANCH_MAX_FILES:200}

## JWT
# HS256 requires a secret of at least 32 bytes. The fallback is dev-only; set JWT_SECRET in production.
security.jwt.secret=${JWT_SECRET:change-me-dev-only-min-32-bytes-secret-0123456789}
security.jwt.expiration-ms=86400000
